draft_invoice:
  id: <%= SecureRandom.uuid %>
  user: one
  customer: one
  invoice_number: "000001"
  status: draft
  subtotal_cents: 15000
  tax_cents: 0
  total_cents: 15000
  application_fee_cents: 0
  days_until_due: 30

open_invoice:
  id: <%= SecureRandom.uuid %>
  user: one
  customer: two
  invoice_number: "000002"
  status: open
  subtotal_cents: 50000
  tax_cents: 0
  total_cents: 50000
  application_fee_cents: 2500
